name: Build and push image to GHCR
description: Authenticate to GCP, buildx, and push an image tagged latest + <version> to GHCR.
inputs:
  version:
    description: Validated version, used as the image tag
    required: true
  gcp-credentials:
    description: GCP service-account JSON (passed to the build as a secret file)
    required: true
runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.gcp-credentials }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        secret-files: |
          gcp_credentials=${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ inputs.version }}
